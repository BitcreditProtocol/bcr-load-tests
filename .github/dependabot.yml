version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    groups:
      npm:
        update-types:
          - "patch"
          - "minor"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 7
    labels:
      - "dependencies"
      - "npm"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    assignees:
      - "zupzup"
